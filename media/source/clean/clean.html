<!doctype html>
<!-- Clean brand graphics: the mark alone on flat navy, nothing else. ?s=pfp | outro | xbanner -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0A0E14;overflow:hidden}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;height:100vh;gap:0}
.word{font:400 1px/1 "Instrument Serif",serif;color:#EFE9DC;letter-spacing:-.005em}
.url{font:500 1px "Geist Mono",monospace;letter-spacing:.28em;color:#DEB471}
.row{display:flex;align-items:center}
</style></head><body><div class="stage" id="st"></div>
<script type="module">
import { logoMark } from "../../../logo.js";
const s = new URLSearchParams(location.search).get("s") || "pfp", st = document.getElementById("st");
const mark = h => { const v = document.createElementNS("http://www.w3.org/2000/svg", "svg"); logoMark(v, { animate: false, sheen: false }); v.style.height = h + "px"; v.style.width = h * .926 + "px"; return v; };
if (s === "pfp") st.append(mark(560));
if (s === "outro") {
  st.append(mark(380));
  const w = document.createElement("div"); w.className = "word"; w.textContent = "Privatus"; w.style.fontSize = "132px"; w.style.marginTop = "44px"; st.append(w);
  const u = document.createElement("div"); u.className = "url"; u.textContent = "PRIVATUSTERMINAL.XYZ"; u.style.fontSize = "20px"; u.style.marginTop = "26px"; st.append(u);
}
if (s === "og") {
  st.append(mark(250));
  const w = document.createElement("div"); w.className = "word"; w.textContent = "Privatus"; w.style.fontSize = "96px"; w.style.marginTop = "30px"; st.append(w);
  const u = document.createElement("div"); u.className = "url"; u.textContent = "TRADE WITHOUT LEAVING A TRAIL"; u.style.fontSize = "17px"; u.style.marginTop = "20px"; u.style.color = "#8B93A1"; st.append(u);
}
if (s === "xbanner") {
  // swooping vector waves in the logo's golds, sweeping in from the right and fading out before the mark
  const NS = "http://www.w3.org/2000/svg", W = 1500, H = 500, v = document.createElementNS(NS, "svg");
  v.setAttribute("viewBox", `0 0 ${W} ${H}`); v.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
  v.innerHTML = `<defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="1560" y2="0"><stop offset="0" stop-color="#C39653" stop-opacity="0"/><stop offset=".35" stop-color="#C39653" stop-opacity=".6"/><stop offset=".7" stop-color="#E6BF7C"/><stop offset="1" stop-color="#F8DEA4"/></linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8DEA4"/><stop offset=".45" stop-color="#DEB471"/><stop offset="1" stop-color="#B98A48"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="m"><rect width="${W}" height="${H}" fill="url(#fade)"/></mask></defs>`;
  const g = document.createElementNS(NS, "g"); g.setAttribute("mask", "url(#m)"); v.append(g);
  // a tapered main swoosh rising across the right half, a lighter counter-swoosh from the top, and fine lines
  // that follow each: all clear of the lockup on the left
  const shape = (d, op = 1) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("fill", "url(#f)"); p.setAttribute("opacity", op); g.append(p); };
  shape("M860 540C1010 470 1150 380 1290 250C1390 160 1460 110 1560 80C1470 130 1410 190 1320 290C1190 430 1050 500 930 540Z");
  shape("M1120 -40C1180 40 1290 100 1420 110C1470 114 1520 108 1560 98C1500 130 1430 140 1360 134C1250 124 1170 70 1150 -40Z", .75);
  const lines = (n, f) => { for (let i = 0; i < n; i++) { const p = document.createElementNS(NS, "path"), [d, w, op] = f(i); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "url(#g)"); p.setAttribute("stroke-width", w); p.setAttribute("opacity", op); g.append(p); } };
  lines(11, i => { const o = i * 13; return [`M${830 + o * .5} 560C${990 + o * .4} ${480 - o * .2} ${1140 + o * .2} ${380 - o * .5} ${1280 + o * .1} ${250 - o * .7}C${1380} ${160 - o * .8} ${1460} ${100 - o * .7} ${1560} ${70 - o * .6}`, (1.5 - i * .08).toFixed(2), (.8 - i * .045).toFixed(2)]; });
  lines(6, i => { const o = i * 12; return [`M${1090 - o * .3} -40C${1160 - o * .2} ${50 + o * .5} ${1270} ${120 + o * .6} ${1560} ${118 + o * .8}`, (1.1 - i * .1).toFixed(2), (.6 - i * .07).toFixed(2)]; });
  document.body.append(v);
  const r = document.createElement("div"); r.className = "row"; r.style.gap = "34px"; r.style.marginLeft = "-440px";
  r.append(mark(190)); const w = document.createElement("div"); w.className = "word"; w.textContent = "Privatus"; w.style.fontSize = "120px"; r.append(w); st.append(r);
}
</script></body></html>
