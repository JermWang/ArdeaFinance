<!doctype html>
<!-- Side by side: our vector coil mark (left) vs Codex's renders (right), in each colourway. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#05080D;color:#EFE9DC;font-family:"Geist Mono",monospace}
body{width:1500px;padding:36px;box-sizing:border-box}
.head{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:14px;font-size:20px;letter-spacing:.2em;text-align:center}
.head b{color:#D6B26E;font-weight:500}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.cell{aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.cell svg{width:100%;height:100%}.cell img{width:100%;height:100%;display:block}
.navy{background:#0A0E14}.paper{background:#F1ECE1}
</style></head><body>
<div class="head"><div><b>A</b> · OURS (VECTOR)</div><div><b>B</b> · CODEX</div></div>
<div class="row"><div class="cell navy" id="g"></div><div class="cell"><img src="codex/privatus-mark-gold.png"></div></div>
<div class="row"><div class="cell navy" id="i"></div><div class="cell"><img src="codex/privatus-mark-ivory.png"></div></div>
<div class="row"><div class="cell paper" id="k"></div><div class="cell"><img src="codex/privatus-mark-ink.png"></div></div>
<script type="module">
import { coilMark } from "../../../crest.js";
const add = (id, tone) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); document.getElementById(id).append(s); coilMark(s, { tone, animate: false, sheen: false }); s.setAttribute("viewBox", "-60 -60 295 295"); };
add("g", "gold"); add("i", "ivory"); add("k", "ink");
</script></body></html>
