<!doctype html>
<!-- The Privatus mark: review sheet. ?still freezes the animation. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#05080D;color:#EFE9DC}
body{width:1800px;height:1000px;display:grid;grid-template-columns:1.2fr 1fr;gap:22px;padding:44px 52px;box-sizing:border-box;font-family:"Geist Mono",monospace}
.hero{border:1px solid #1C2533;border-radius:20px;background:radial-gradient(circle at 50% 45%,#141F33,#070A10 66%);display:grid;place-items:center;position:relative}
.hero svg{width:760px;height:auto}
.cap{position:absolute;left:28px;top:24px;font-size:12px;letter-spacing:.22em;color:#8B93A1}.cap b{color:#D6B26E;font-weight:500}
.side{display:grid;grid-template-rows:auto auto 1fr;gap:22px}
.panel{border:1px solid #1C2533;border-radius:20px;background:#0A0E14;padding:26px 30px;display:flex;align-items:center;gap:20px}
.panel.paper{background:#F1ECE1;border-color:#DED5C2;color:#0E1520}
.lock svg{height:84px;width:auto}.lock span{font:400 92px/1 "Instrument Serif",serif;letter-spacing:-.005em}
.lock.paper span{color:#0E1520}
.row{display:flex;align-items:flex-end;gap:26px}
.s{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#5E6878}
.crest svg{width:230px;height:230px}
.nav{display:flex;align-items:center;gap:10px;background:#0E131B;border:1px solid #263142;border-radius:8px;padding:9px 14px}.nav svg{height:26px;width:auto}.nav span{font:400 26px/1 "Instrument Serif",serif}
.fav{border-radius:8px;background:#0A0E14;border:1px solid #263142;display:grid;place-items:center}.f32{width:44px;height:44px}.f32 svg{width:36px;height:auto}.f16{width:26px;height:26px}.f16 svg{width:20px;height:auto}
</style></head><body>
<div class="hero"><span class="cap">PRIVATUS · <b>THE MARK</b></span></div>
<div class="side">
  <div class="panel lock" id="l1"><span>Privatus</span></div>
  <div class="panel paper lock" id="l2"><span>Privatus</span></div>
  <div class="panel row">
    <div class="s crest" id="crest">CREST · PFP</div>
    <div class="s"><div class="nav" id="nav"><span>Privatus</span></div>NAV</div>
    <div class="s"><div class="fav f32" id="f32"></div>32</div>
    <div class="s"><div class="fav f16" id="f16"></div>16</div>
  </div>
</div>
<script type="module">
import { chameleonMark, crest } from "../../../crest.js";
const still = new URLSearchParams(location.search).has("still");
const svg = () => document.createElementNS("http://www.w3.org/2000/svg", "svg");
const add = (host, s) => { host.prepend(s); return s; };
chameleonMark(add(document.querySelector(".hero"), svg()), { animate: !still });
chameleonMark(add(document.getElementById("l1"), svg()), { animate: !still, branch: false });
chameleonMark(add(document.getElementById("l2"), svg()), { animate: !still, branch: false, tone: "paper", sheen: false });
crest(add(document.getElementById("crest"), svg()), { animate: !still });
chameleonMark(add(document.getElementById("nav"), svg()), { animate: !still, branch: false });
chameleonMark(add(document.getElementById("f32"), svg()), { animate: false, branch: false, sheen: false });
chameleonMark(add(document.getElementById("f16"), svg()), { animate: false, branch: false, sheen: false });
</script></body></html>
