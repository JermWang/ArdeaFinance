<!doctype html>
<!-- The voxel chameleon: review sheet (hero, PFP, nav, favicon sizes). ?t=<seconds> freezes a frame. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#05080D;color:#EFE9DC}
body{width:1800px;height:1000px;display:grid;grid-template-columns:1.25fr 1fr;gap:22px;padding:44px 52px;box-sizing:border-box;font-family:"Geist Mono",monospace}
.hero{border:1px solid #263142;border-radius:20px;background:radial-gradient(circle at 50% 46%,#1B2944,#0A0E14 64%);display:grid;place-items:center;position:relative}
.hero svg{width:860px;height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.cap{position:absolute;left:28px;top:24px;font-size:12px;letter-spacing:.22em;color:#8B93A1}.cap b{color:#D6B26E;font-weight:500}
.side{display:grid;grid-template-rows:auto auto 1fr;gap:22px}
.panel{border:1px solid #263142;border-radius:20px;background:#0A0E14;padding:28px;display:flex;align-items:center;gap:22px}
.panel.paper{background:#F1ECE1;border-color:#DED5C2;color:#0E1520}
.lock svg{height:110px;width:auto}.lock span{font:400 96px/1 "Instrument Serif",serif}
.sizes{align-items:end}
.s{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#5E6878}
.pfp{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1E2C48,#0A0E14 70%);border:1px solid #33405A;display:grid;place-items:center;overflow:hidden}.pfp svg{width:150px;height:auto}
.nav{display:flex;align-items:center;gap:10px;background:#0E131B;border:1px solid #263142;border-radius:8px;padding:8px 14px}.nav svg{height:32px;width:auto}.nav span{font:400 26px/1 "Instrument Serif",serif}
.fav{border-radius:7px;background:#0A0E14;border:1px solid #263142;display:grid;place-items:center}.f32{width:40px;height:40px}.f32 svg{width:34px;height:auto}.f16{width:24px;height:24px}.f16 svg{width:20px;height:auto}
</style></head><body>
<div class="hero"><span class="cap">PRIVATUS · <b>THE CHAMELEON</b> · VOXEL</span></div>
<div class="side">
  <div class="panel lock" id="l1"><span>Privatus</span></div>
  <div class="panel paper lock" id="l2"><span>Privatus</span></div>
  <div class="panel sizes">
    <div class="s"><div class="pfp" id="pfp"></div>PFP</div>
    <div class="s"><div class="nav" id="nav"><span>Privatus</span></div>NAV</div>
    <div class="s"><div class="fav f32" id="f32"></div>32</div>
    <div class="s"><div class="fav f16" id="f16"></div>16</div>
  </div>
</div>
<script type="module">
import { voxelChameleon } from "../../../voxel.js";
const t = new URLSearchParams(location.search).get("t");
const mk = (host, o = {}) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); host.prepend(s); voxelChameleon(s, { still: t != null, ...o }); return s; };
mk(document.querySelector(".hero"), { s: 8, at: Number(t) || 2.2 });
mk(document.getElementById("l1"), { tongue: false, camo: false });
mk(document.getElementById("l2"), { tongue: false, camo: false });
mk(document.getElementById("pfp"), { tongue: false });
mk(document.getElementById("nav"), { tongue: false, camo: false });
mk(document.getElementById("f32"), { tongue: false, camo: false, still: true });
mk(document.getElementById("f16"), { tongue: false, camo: false, still: true });
</script></body></html>
